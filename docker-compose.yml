services:

  mysql:
    image: mysql:8.0
    container_name: prepforge-mysql
    environment:
      MYSQL_DATABASE: prepforge
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./prepForge-backend/prepforge.sql:/docker-entrypoint-initdb.d/prepforge.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: prepforge-backend:latest
    container_name: prepforge-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/prepforge
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: prepforge-frontend:latest
    container_name: prepforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data: